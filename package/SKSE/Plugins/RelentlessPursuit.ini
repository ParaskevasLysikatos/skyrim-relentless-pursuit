; Relentless Pursuit - settings
; Restart the game after changing anything here.
; Log: Documents\My Games\Skyrim Special Edition\SKSE\RelentlessPursuit.log

[General]
; Enemies follow you through load doors (houses, caves, forts, city gates).
bDoorPursuit = 1

; Many cells (most outdoor cells, many houses) have no encounter zone, and enemies won't follow you
; into those. While you're in one, give it the no-boundary zone from RelentlessPursuit.esp.
; Needs RelentlessPursuit.esp ticked in the plugin list.
bNoZoneCells = 1

; Enemies fighting you come through the load door after you, wherever it leads (house, dungeon,
; outside). The game itself only lets up to 2 enemies that are right at the door follow.
; Each one arrives after about (distance / 350) seconds, between 2 and 12 s, at the spot where you
; came out, and only if you're still in that area. Dragons, immobile and mounted enemies never come,
; nor animals that never attack (deer, goats, elk, foxes, rabbits, horses: Aggression "Unaggressive").
bTeleportFollow = 1
; Also bring hostile enemies that are on alert (heard the fight, weapon out) but not fighting you yet,
; like the rest of a camp. They come after the ones fighting you. Enemies searching for you after
; losing sight of you already count as fighting you.
bAlertedFollow = 1
; How far away (in units, 8192 = ~115 m) an enemy can be when you use the door.
fFollowRadius = 8192
; At most this many enemies per door (the closest ones).
iMaxFollowers = 8
; 1 = enemies that belong to a quest (bounty targets, Civil War soldiers...) stay behind.
; Quests that count the enemies left in a location can get stuck if those enemies leave it.
bSkipQuestActors = 0
; Enemies stop fighting once you leave their cell, so they come out calm and their normal AI would
; walk them back through the door. For this many seconds after coming through, each one that isn't
; fighting attacks you again, and one that walks back through the door is brought out again (up to
; iMaxReturns times). After that the normal AI takes over: if you got away, they go home. 0 = off.
fPursuitTime = 30
iMaxReturns = 2

; Enemies that can swim (people, elves, wolves, bears, sabre cats...) keep fighting you in water.
; Creatures with no swim animation (draugr, skeletons, trolls, spiders, Dwemer machines) stop at the shore.
bWaterPursuit = 1

[BodyAlarm]
; An enemy that finds the body of one of its own that you (or a follower or summon of yours) killed comes
; straight at you, even if it never saw you - if you're close enough. The game itself only makes it search.
; Each enemy does it once per body and at most every 30 s. Bodies are remembered for 10 minutes.
bBodyAlarm = 1
; You within this many units of the enemy (2800 = ~40 m). Further away it only searches, as in the base game.
fBodyAlarmRange = 2800
; The enemy within this many units of the body (1024 = ~15 m) while it is on alert = it found the body.
fBodyAlarmBodyDistance = 1024
; Seconds between finding the body ("Someone killed...!") and attacking.
fBodyAlarmDelay = 2
; 1 = creatures (wolves, draugr, Falmer, spiders...) do it too; 0 = only people.
; Animals that never attack (deer, goats, elk, foxes...) never do it.
bBodyAlarmCreatures = 1
; 1 = no alarm while you're invisible (Invisibility, Shadowcloak).
bBodyAlarmInvisibilityHides = 1

[Dragons]
; Dragons that are fighting stop chasing when you use a load door.
; If one still comes through within 90 seconds, it is sent back outside that door.
bDragonGuard = 1

[Exclusions]
; Dragons are always excluded. Add more creature races here as Plugin|FormID, comma separated.
; Example - giants and mammoths:
;   sExtraExcludedRaces = Skyrim.esm|0x0131F9, Skyrim.esm|0x0131FF
sExtraExcludedRaces =
