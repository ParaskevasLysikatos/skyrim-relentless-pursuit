; Relentless Pursuit - settings
; Restart the game after changing anything here.
; Log: Documents\My Games\Skyrim Special Edition\SKSE\RelentlessPursuit.log

[General]
; Enemies follow you through load doors (houses, caves, forts, city gates).
bDoorPursuit = 1

; Many cells (most outdoor cells, many houses) have no encounter zone, and enemies won't follow you
; into those. While you're in one, give it the no-boundary zone from RelentlessPursuit.esp.
; Needs RelentlessPursuit.esp ticked in the plugin list.
bNoZoneCells = 1

; Enemies that can swim (people, elves, wolves, bears, sabre cats...) keep fighting you in water.
; Creatures with no swim animation (draugr, skeletons, trolls, spiders, Dwemer machines) stop at the shore.
bWaterPursuit = 1

; Dragons that are fighting stop chasing when you use a load door.
; If one still comes through within 90 seconds, it is sent back outside that door.
bDragonGuard = 1

[Exclusions]
; Dragons are always excluded. Add more creature races here as Plugin|FormID, comma separated.
; Example - giants and mammoths:
;   sExtraExcludedRaces = Skyrim.esm|0x0131F9, Skyrim.esm|0x0131FF
sExtraExcludedRaces =
